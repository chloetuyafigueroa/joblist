steps:
- name: 'gcr.io/cloud-builders/docker'
  args:
    [
      'build',
      '-t',
      'asia-southeast1-docker.pkg.dev/$PROJECT_ID/omms-repo/joblist:$SHORT_SHA',
      '.'
    ]

- name: 'gcr.io/cloud-builders/docker'
  args:
    [
      'push',
      'asia-southeast1-docker.pkg.dev/$PROJECT_ID/omms-repo/joblist:$SHORT_SHA'
    ]

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    [
      'run',
      'deploy',
      'joblist',
      '--image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/omms-repo/joblist:$SHORT_SHA',
      '--region=asia-southeast1',
      '--platform=managed',
      '--allow-unauthenticated'
    ]